version: "3.8"

services:

  # =========================
  # Go Engine Service
  # =========================
  go-engine:
    build:
      context: ./engine-go
      dockerfile: Dockerfile
    container_name: finance_go_engine
    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "50051:50051"
    depends_on:
      - postgres

  # =========================
  # Spring Boot API Service
  # =========================
  api-spring:
    build:
      context: ./api-spring
      dockerfile: Dockerfile
    container_name: finance_api_spring
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  # =========================
  # Postgres Database
  # =========================
  postgres:
    image: postgres:16
    container_name: finance_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # =========================
  # Redis Cache
  # =========================
  redis:
    image: redis:8
    container_name: finance_redis
    ports:
      - "6380:6380"
    command: redis-server --requirepass "YourStrongPassword"

volumes:
  pgdata:
  redisdata:
