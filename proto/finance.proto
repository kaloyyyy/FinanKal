syntax = "proto3";

package finance;

option java_package = "com.finankal.api.finance";
option java_outer_classname = "FinanceProtos";
import "google/protobuf/timestamp.proto";
option go_package = "github.com/kaloy/finankal/engine-go/finance";


service FinanceEngine {

  // Health
  rpc HealthCheck(HealthRequest) returns (HealthResponse);


  // Ledger
  rpc CreateTransaction(CreateTransactionRequest)
      returns (CreateTransactionResponse);

  rpc GetBalance(GetBalanceRequest)
      returns (GetBalanceResponse);

  rpc GetAccountSummary(GetAccountSummaryRequest)
      returns (GetAccountSummaryResponse);

  rpc GetLedgerEntries(GetLedgerEntriesRequest)
      returns (GetLedgerEntriesResponse);

  rpc GetUserTotalCredit(GetUserTotalRequest)
      returns (GetUserTotalResponse);

  rpc GetUserTotalDebit(GetUserTotalRequest)
      returns (GetUserTotalResponse);

  rpc GetUserTotalBalance(GetUserTotalRequest)
      returns (GetUserTotalResponse);



  // ============================
  // Credit Card
  // ============================

  rpc CreateCreditCard(CreateCreditCardRequest)
      returns (CreateCreditCardResponse);


  rpc RecordCreditCardTransaction(
      RecordCreditCardTransactionRequest
      )
      returns (
      RecordCreditCardTransactionResponse
      );


  rpc PayCreditCardStatement(
      PayCreditCardStatementRequest
      )
      returns (
      PayCreditCardStatementResponse
      );


  rpc GetCreditCardStatement(
      GetCreditCardStatementRequest
      )
      returns (
      GetCreditCardStatementResponse
      );

}


// =========================
// Health
// =========================

message HealthRequest {}

message HealthResponse {
  string status = 1;
}


// =========================
// Ledger
// =========================

message CreateTransactionRequest {
  string description = 1;
  repeated Entry entries = 2;
}

message CreateTransactionResponse {
  string transaction_id = 1;
}


message Entry {
  string account_id = 1;
  string amount = 2;
  string type = 3;
}


message GetBalanceRequest {
  string account_id = 1;
}

message GetBalanceResponse {
  string balance = 1;
}


message GetAccountSummaryRequest {
  string account_id = 1;
}


message GetAccountSummaryResponse {
  string account_id = 1;
  string name = 2;
  string type = 3;
  string balance = 4;
  string created_at = 5;
}


message GetLedgerEntriesRequest {
  string account_id = 1;
}


message GetLedgerEntriesResponse {
  repeated LedgerEntry entries = 1;
}


message LedgerEntry {
  string transaction_id = 1;
  string account_id = 2;
  string amount = 3;
  string type = 4;
  string description = 5;
  string created_at = 6;
}


message GetUserTotalRequest {
  string user_id = 1;
}


message GetUserTotalResponse {
  string user_id = 1;
  string total_credit = 2;
  string total_debit = 3;
  string total_balance = 4;
}



// =========================
// Credit Card
// =========================


message CreateCreditCardRequest {

  string account_id = 1;

  string credit_limit = 2;

  int32 billing_day = 3;

  int32 payment_due_days = 4;

}


message CreateCreditCardResponse {

  string credit_card_id = 1;

}



message RecordCreditCardTransactionRequest {

  string card_id = 1;

  string amount = 2;

  string description = 3;

  google.protobuf.Timestamp purchase_date = 4;
}



message RecordCreditCardTransactionResponse {

  string transaction_id = 1;

}



message PayCreditCardStatementRequest {

  string statement_id = 1;

  string card_id = 2;

  string payment_account_id = 3;

  string amount = 4;

  string description = 5;

}



message PayCreditCardStatementResponse {

  string transaction_id = 1;

}



message GetCreditCardStatementRequest {

  string statement_id = 1;

}



message GetCreditCardStatementResponse {

  string statement_id = 1;

  string credit_card_id = 2;

  string start_date = 3;

  string end_date = 4;

  string statement_date = 5;

  string due_date = 6;

  string total_amount = 7;

  string status = 8;

}