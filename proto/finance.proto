syntax = "proto3";

package finance;

// Java-specific options
option java_package = "com.finankal.api.finance";
option java_outer_classname = "FinanceProtos";

option go_package = "github.com/kaloy/finankal/engine-go/finance";

service FinanceEngine {
  rpc HealthCheck(HealthRequest) returns (HealthResponse);
  rpc CreateTransaction(CreateTransactionRequest) returns (CreateTransactionResponse);
  rpc GetBalance(GetBalanceRequest) returns (GetBalanceResponse);
  rpc GetAccountSummary(GetAccountSummaryRequest) returns (GetAccountSummaryResponse);
  rpc GetLedgerEntries(GetLedgerEntriesRequest) returns (GetLedgerEntriesResponse);
  rpc GetUserTotalCredit(GetUserTotalRequest) returns (GetUserTotalResponse);
  rpc GetUserTotalDebit(GetUserTotalRequest) returns (GetUserTotalResponse);
  rpc GetUserTotalBalance(GetUserTotalRequest) returns (GetUserTotalResponse);
}

message HealthRequest {}
message HealthResponse {
  string status = 1;
}

message CreateTransactionRequest {
  string description = 1;
  repeated Entry entries = 2;
}

message CreateTransactionResponse {
  string transaction_id = 1;
}

message Entry {
  string account_id = 1;
  string amount = 2;
  string type = 3; // DEBIT or CREDIT
}

message GetBalanceRequest {
  string account_id = 1;
}

message GetBalanceResponse {
  string balance = 1;
}

message GetAccountSummaryRequest {
  string account_id = 1;
}

message GetAccountSummaryResponse {
  string account_id = 1;
  string name = 2;
  string type = 3;
  string balance = 4;
  string created_at = 5;
}

message GetLedgerEntriesRequest {
  string account_id = 1;
}

message GetLedgerEntriesResponse {
  repeated LedgerEntry entries = 1;
}

message LedgerEntry {
  string transaction_id = 1;
  string account_id = 2;
  string amount = 3;
  string type = 4; // DEBIT or CREDIT
  string description = 5;
  string created_at = 6;
}

message GetUserTotalRequest {
  string user_id = 1;
}

message GetUserTotalResponse {
  string user_id = 1;
  string total_credit = 2;
  string total_debit = 3;
  string total_balance = 4;
}
