syntax = "proto3";

package finance;

option java_package = "com.finankal.api.finance";
option java_outer_classname = "FinanceProtos";
import "google/protobuf/timestamp.proto";
option go_package = "github.com/kaloy/finankal/engine-go/finance";


service FinanceEngine {

  // Health
  rpc HealthCheck(HealthRequest) returns (HealthResponse);

  // Ledger
  rpc CreateTransaction(CreateTransactionRequest)
      returns (CreateTransactionResponse);

  rpc GetBalance(GetBalanceRequest)
      returns (GetBalanceResponse);

  rpc GetAccountSummary(GetAccountSummaryRequest)
      returns (GetAccountSummaryResponse);

  rpc GetUserAccounts(GetUserAccountsRequest)
      returns (GetUserAccountsResponse);

  rpc GetLedgerEntries(GetLedgerEntriesRequest)
      returns (GetLedgerEntriesResponse);

  rpc GetUserTotalCredit(GetUserTotalRequest)
      returns (GetUserTotalResponse);

  rpc GetUserTotalDebit(GetUserTotalRequest)
      returns (GetUserTotalResponse);

  rpc GetUserNetWorth(GetUserTotalRequest)
      returns (GetUserTotalResponse);

  rpc GetRecentTransactions(GetRecentTransactionsRequest)
      returns (GetRecentTransactionsResponse);

  rpc GetTransaction(GetTransactionRequest)
      returns (TransactionResponse);

  rpc GetUserTransactions(GetUserTransactionsRequest)
      returns (GetUserTransactionsResponse);

  // Changes one transaction's description, date and its entries' accounts and amounts (entries can't be
  // added or removed). NOT_FOUND when it isn't the user's; INVALID_ARGUMENT when it doesn't balance.
  rpc UpdateTransaction(UpdateTransactionRequest)
      returns (UpdateTransactionResponse);

  // Deletes one transaction; installments it paid go back to pending. NOT_FOUND when it isn't the user's.
  rpc DeleteTransaction(DeleteTransactionRequest)
      returns (DeleteTransactionResponse);

  rpc GetMoneyFlows(GetMoneyFlowsRequest)
      returns (GetMoneyFlowsResponse);

  rpc GetPayables(GetPayablesRequest)
      returns (GetPayablesResponse);

  // Records a loan's repayment schedule: one pending installment per row, paid from source into the loan.
  rpc CreateInstallments(CreateInstallmentsRequest)
      returns (CreateInstallmentsResponse);

  rpc UpdateInstallments(UpdateInstallmentsRequest) returns (UpdateInstallmentsResponse);
  rpc DeleteInstallments(DeleteInstallmentsRequest) returns (DeleteInstallmentsResponse);
  rpc PayInstallment(PayInstallmentRequest) returns (PayInstallmentResponse);
  rpc GetLoan(GetLoanRequest) returns (LoanDetails);
  rpc UpdateLoan(UpdateLoanRequest) returns (UpdateLoanResponse);
  rpc DeleteLoan(DeleteLoanRequest) returns (DeleteLoanResponse);
  rpc SetPaikotLink(SetPaikotLinkRequest) returns (SetPaikotLinkResponse);

  // Deletes all of the user's transactions (and card / bank statements built from them); accounts stay.
  rpc ClearUserTransactions(ClearUserTransactionsRequest)
      returns (ClearUserTransactionsResponse);

  // ============================
  // Bank statements (docs/adr/0001-bank-statement-import.md)
  // ============================

  // Records a parsed statement and its rows atomically, keeps one opening balance per account,
  // and reconciles the account's statements. ALREADY_EXISTS for a file or period imported before.
  rpc ListBankStatements(ListBankStatementsRequest)
      returns (ListBankStatementsResponse);

  rpc ImportBankStatement(ImportBankStatementRequest)
      returns (ImportBankStatementResponse);

  // Records a loan from the lender's disclosure statement: the loan account, the money lent, the fees
  // deducted and its installments. Interest is charged each due date on what's still owed, so paying
  // ahead lowers it. ALREADY_EXISTS when the loan or file was imported before.
  rpc ImportLoan(ImportLoanRequest)
      returns (ImportLoanResponse);
  // ============================
  // Credit Card
  // ============================

  rpc CreateCreditCard(CreateCreditCardRequest)
      returns (CreateCreditCardResponse);


  rpc RecordCreditCardTransaction(RecordCreditCardTransactionRequest)
      returns (RecordCreditCardTransactionResponse);


  rpc PayCreditCardStatement(PayCreditCardStatementRequest)
      returns (PayCreditCardStatementResponse);


  rpc GetCreditCardStatement(GetCreditCardStatementRequest)
      returns (GetCreditCardStatementResponse);

}


// =========================
// Health
// =========================

message HealthRequest {}

message HealthResponse {string status = 1;}


// =========================
// Ledger
// =========================

message CreateTransactionRequest {string description = 1;
  repeated Entry entries = 2;
  // When the transaction happened (e.g. the date on a bank statement). Unset = now.
  google.protobuf.Timestamp occurred_at = 3;}

message CreateTransactionResponse {string transaction_id = 1;}


message Entry {string account_id = 1;
  string amount = 2;
  string type = 3;}


message GetBalanceRequest {string account_id = 1;}

message GetBalanceResponse {string balance = 1;}

message GetAccountSummaryRequest {string account_id = 1;}

message GetAccountSummaryResponse {
  Account account = 1;
}

message Account {
  string id = 1;
  string name = 2;
  string type = 3;
  string balance = 4;
  google.protobuf.Timestamp created_at = 5;
  string credit_limit = 6;
  int32 billing_day = 7;
  string statement_shift = 8;
}

enum AccountType {
  ACCOUNT_TYPE_UNSPECIFIED = 0;
  ASSET = 1;
  LIABILITY = 2;
  EQUITY = 3;
  INCOME = 4;
  EXPENSE = 5;
  CREDIT_CARD = 6;
}

message GetUserAccountsRequest {
  string user_id = 1;
}

message GetUserAccountsResponse {
  repeated Account accounts = 1;
}

message GetLedgerEntriesRequest {string account_id = 1;}


message GetLedgerEntriesResponse {repeated LedgerEntry entries = 1;}


message LedgerEntry {string transaction_id = 1;
  string account_id = 2;
  string amount = 3;
  string type = 4;
  string description = 5;
  string created_at = 6;}

message GetRecentTransactionsRequest {
  string user_id = 1;
  int32 limit = 2;
}

message GetRecentTransactionsResponse {
  repeated RecentTransaction transactions = 1;
}

message GetTransactionRequest {
  string transaction_id = 1;
}

message TransactionResponse {
  string id = 1;
  string description = 2;
  google.protobuf.Timestamp created_at = 3;
  repeated TransactionEntry entries = 4;
}

message TransactionEntry {
  string id = 1;
  string transaction_id = 2;
  string account_id = 3;
  string account_name = 4;
  string account_type = 5;
  string amount = 6;
  string type = 7;
}

message GetUserTransactionsRequest {
  string user_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message GetUserTransactionsResponse {
  repeated TransactionResponse transactions = 1;
  int32 total = 2;
}

// Dates are yyyy-MM-dd Philippine calendar days; "" = no limit. `to` is inclusive.
message GetMoneyFlowsRequest {
  string user_id = 1;
  string from = 2;
  string to = 3;
}

// Money that moved from one account to another (credited → debited side), summed over transactions.
message MoneyFlow {
  string from_account_id = 1;
  string to_account_id = 2;
  string amount = 3;
  int32 transactions = 4;
}

message GetMoneyFlowsResponse {
  repeated MoneyFlow flows = 1; // largest first
}

message GetPayablesRequest {
  string user_id = 1;
}

// One unpaid installment of a loan or card. due_date is yyyy-MM-dd.
message Payable {
  string name = 1;
  string account_id = 2;
  string account_name = 3;
  string due_date = 4;
  string amount = 5;
  int32 installment_number = 6; // 0 when unknown
  int32 installments = 7;       // 0 when unknown
  string source_account_id = 8; // empty for card bills without a scheduled source
  string schedule_id = 9;
  string occurrence_id = 10;
  string scheduled_date = 11; // yyyy-MM-dd; retained when due_date is the card's statement deadline
  // Paikot: set when the account is linked to a card that can pay this due. Dates are yyyy-MM-dd.
  string paikot_card_id = 12;
  string paikot_card_name = 13;
  string paikot_pay_from = 14; // charge the card from this day (after its statement date) ...
  string paikot_pay_by = 15;   // ... to this one, and it's billed on the card's next statement,
  string paikot_due_date = 16; // due on this day
  string paikot_fee = 17;
  string principal = 18; // how much of the amount holds a card's limit until paid; empty = all of it
  string monthly_rate_percent = 19; // the plan's monthly interest rate, e.g. "1.78805"; empty = none
}

message SetPaikotLinkRequest {
  string user_id = 1;
  string account_id = 2;  // the loan or card whose dues get paid
  string card_id = 3;     // the card that pays them; empty removes the link
  string fee_percent = 4; // of the amount paid, e.g. "1.5"
}
message SetPaikotLinkResponse {}

message GetPayablesResponse {
  repeated Payable payables = 1; // soonest first
}

message Installment {
  string due_date = 1; // yyyy-MM-dd
  string amount = 2;
}

message CreateInstallmentsRequest {
  string user_id = 1;
  string name = 2;              // e.g. "Mari Loan ₱33,000 (12 months, from 21 Sep 2026)"
  string source_account_id = 3; // where payments come from
  string account_id = 4;        // the loan or card being paid down
  repeated Installment installments = 5; // in due-date order, numbered from 1
}

message CreateInstallmentsResponse {
  string schedule_id = 1;
}

message UpdateInstallmentsRequest {
  string user_id = 1;
  string schedule_id = 2;
  string name = 3;
  string source_account_id = 4;
  repeated Installment installments = 5;
  int32 first_installment_number = 6;
  string monthly_rate_percent = 7; // empty = none
}
message UpdateInstallmentsResponse {}
message DeleteInstallmentsRequest { string user_id = 1; string schedule_id = 2; }
message DeleteInstallmentsResponse {}
message PayInstallmentRequest { string user_id = 1; string occurrence_id = 2; }
message PayInstallmentResponse { string transaction_id = 1; }
message GetLoanRequest { string user_id = 1; string account_id = 2; }
message LoanDetails {
  string account_id = 1;
  string name = 2;
  string booked_on = 3;
  string daily_rate = 4;
  string principal_on = 5;
  string principal = 6;
}
message UpdateLoanRequest { string user_id = 1; LoanDetails loan = 2; }
message UpdateLoanResponse {}
message DeleteLoanRequest { string user_id = 1; string account_id = 2; }
message DeleteLoanResponse {}

message UpdateTransactionRequest {
  string user_id = 1;
  string transaction_id = 2;
  string description = 3;
  // Unset = keep the current date.
  google.protobuf.Timestamp occurred_at = 4;
  // Every current entry, by id, with its new account, amount and type.
  repeated TransactionEntry entries = 5;
}

message UpdateTransactionResponse {}

message DeleteTransactionRequest {
  string user_id = 1;
  string transaction_id = 2;
}

message DeleteTransactionResponse {}

message ClearUserTransactionsRequest {
  string user_id = 1;
}

message ClearUserTransactionsResponse {
  int64 deleted_transactions = 1;
}

// Dates are yyyy-MM-dd calendar days (Philippine time). Amounts are decimal strings.
message ListBankStatementsRequest {
  string user_id = 1;
}

// One imported statement. Dates are yyyy-MM-dd calendar days.
message BankStatementSummary {
  string id = 1;
  string account_id = 2;
  string bank = 3;
  string period_start = 4;
  string period_end = 5;
  google.protobuf.Timestamp imported_at = 6;
}

message ListBankStatementsResponse {
  repeated BankStatementSummary statements = 1; // oldest period first
}

// Without account_id, the account is found by account_number, or created as account_name.
message ImportBankStatementRequest {
  string account_id = 1;      // "" = find the account by account_number
  string user_id = 9;
  string account_number = 10; // digits printed on the statement, "" when not found
  string account_name = 11;   // name for the account if it has to be created
  string account_type = 12;   // "ASSET" (bank / wallet, default) or "CREDIT_CARD": balances owed, charges are money out
  // A credit card statement's bill, so its deadline is tracked ("" on a bank statement or a card history).
  string statement_date = 13; // yyyy-MM-dd
  string due_date = 14;       // yyyy-MM-dd, "" = work it out from the card's rule
  string total_due = 15;      // amount owed on the bill
  string bank = 2;
  string period_start = 3;
  string period_end = 4;
  string opening_balance = 5; // "" when the statement doesn't print one
  string closing_balance = 6; // "" when the statement doesn't print one
  string file_sha256 = 7;     // hex SHA-256 of the uploaded file, to refuse re-imports
  repeated StatementRow rows = 8;
  // true = replace the account's statement for the same file or period (and its rows) instead of refusing it.
  bool replace = 16;
}

message StatementRow {
  string date = 1;
  string description = 2;
  string amount = 3;  // positive
  bool money_out = 4; // true = left the account
  // Income / expense account to record it against, e.g. "Salary Income". "" = Incoming / Outgoing
  // Transfers, and the row may be joined with the other end of a transfer between the user's accounts.
  string category = 5;
}

message ImportBankStatementResponse {
  string statement_id = 1;
  int32 imported = 2;
  // Where the ledger and the account's statements disagree (missing month, misread row, manual entry).
  repeated string warnings = 3;
  // Rows left out because the account already had a transaction on that day for that amount and direction.
  repeated string duplicates = 4;
  string account_id = 5;   // the account the statement went into
  string account_name = 6;
  // Rows joined with the other end of the transfer already imported on another of the user's accounts.
  repeated string transfers = 7;
}

// Dates are yyyy-MM-dd calendar days (Philippine time). Amounts are decimal strings.
message ImportLoanRequest {
  string user_id = 1;
  string account_number = 2;
  string account_name = 3;          // name for the loan account if it has to be created
  string booked_on = 4;
  string amount = 5;                // lent
  string deducted = 6;              // fees and taxes taken from the proceeds, booked to Loan Fees
  string daily_rate = 7;            // interest per day on what's owed, e.g. "0.00133"
  string source_account_id = 8;     // where payments come from, "" = not known
  string schedule_name = 9;
  string file_sha256 = 10;
  repeated Installment installments = 11; // in due-date order, numbered from 1
}

message ImportLoanResponse {
  string account_id = 1;
  string account_name = 2;
}

message RecentTransaction {
  string id = 1;
  string description = 2;
  string amount = 3;
  string direction = 4;
  string account_name = 5;
  string created_at = 6;
}
message GetUserTotalRequest {string user_id = 1;}


message GetUserTotalResponse {string user_id = 1;
  string total_credit = 2;
  string total_debit = 3;
  string total_balance = 4;}



// =========================
// Credit Card
// =========================


message CreateCreditCardRequest {string account_id = 1;      // optional
  string account_name = 2;    // used when creating one
  string credit_limit = 3;
  int32 billing_day = 4;
  int32 payment_due_days = 5;}


message CreateCreditCardResponse {string credit_card_id = 1;}



message RecordCreditCardTransactionRequest {string card_id = 1;
  string amount = 2;
  string description = 3;
  google.protobuf.Timestamp purchase_date = 4;}



message RecordCreditCardTransactionResponse {string transaction_id = 1;}



message PayCreditCardStatementRequest {string statement_id = 1;
  string card_id = 2;
  string payment_account_id = 3;
  string amount = 4;
  string description = 5;

}



message PayCreditCardStatementResponse {string transaction_id = 1;}



message GetCreditCardStatementRequest {string statement_id = 1;}



message GetCreditCardStatementResponse {string statement_id = 1;
  string credit_card_id = 2;
  string start_date = 3;
  string end_date = 4;
  string statement_date = 5;
  string due_date = 6;
  string total_amount = 7;
  string status = 8;}
