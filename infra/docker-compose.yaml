version: '3.8'

services:

  postgres:
    image: postgres:15
    container_name: finance_postgres
    restart: always
    environment:
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance123
      POSTGRES_DB: finance_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  go-engine:
    build: ../engine-go
    container_name: finance_go_engine
    restart: always
    depends_on:
      - postgres
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: finance
      DB_PASSWORD: finance123
      DB_NAME: finance_db
    ports:
      - "50051:50051"
    # volumes:
    #   - ../engine-go:/app   # REMOVE THIS


  spring-api:
    build: ../api-spring
    container_name: finance_spring_api
    restart: always
    depends_on:
      - go-engine
      - postgres
    environment:
      GRPC_HOST: go-engine
      GRPC_PORT: 50051
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: finance
      DB_PASSWORD: finance123
      DB_NAME: finance_db
    ports:
      - "8080:8080"
    # Remove the bind mount during build for clean image
    # volumes:
    #   - ../api-spring:/app


volumes:
  pgdata: