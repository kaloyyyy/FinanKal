openapi: 3.1.0
info:
  title: FinanKal API
  version: 0.0.1
  description: Spring Boot API Gateway for FinanKal Finance Engine

servers:
  - url: http://localhost:8080
    description: Local dev server

paths:
  /health:
    get:
      summary: Health check
      description: Returns the health status of the Go engine via gRPC
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: UP

  /ledger/accounts:
    post:
      summary: Create ledger account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - type
                - currency
              properties:
                name:
                  type: string
                type:
                  type: string
                  enum: [asset, liability, equity, revenue, expense]
                currency:
                  type: string
                  example: PHP
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  type:
                    type: string
                  currency:
                    type: string

    get:
      summary: List all ledger accounts
      responses:
        '200':
          description: List of accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
                    type:
                      type: string
                    currency:
                      type: string

  /ledger/accounts/{id}/balance:
    get:
      summary: Get account balance
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Account balance
          content:
            application/json:
              schema:
                type: object
                properties:
                  account_id:
                    type: integer
                  balance:
                    type: number
                    example: 1200.50

  /ledger/transactions:
    post:
      summary: Create transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - description
                - entries
              properties:
                description:
                  type: string
                entries:
                  type: array
                  items:
                    type: object
                    required: [account_id, debit, credit]
                    properties:
                      account_id:
                        type: integer
                      debit:
                        type: integer
                      credit:
                        type: integer
      responses:
        '201':
          description: Transaction posted
          content:
            application/json:
              schema:
                type: object
                properties:
                  transaction_id:
                    type: integer
                  status:
                    type: string
                    example: posted
